# Lefthook - Master General Chapter (Root)
pre-commit:
  parallel: true
  commands:
    anti-slop-tokens:
      run: node scripts/git-guard.mjs tokens {staged_files}
      glob: "*.{ts,tsx,js,jsx,json,md,html,mjs}"
    secrets:
      run: node scripts/git-guard.mjs secrets {staged_files}
      glob: "*"
    contracts:
      run: node contracts/verify-contracts.mjs

commit-msg:
  commands:
    conventional-commit:
      run: node scripts/git-guard.mjs commit-msg {1}

pre-push:
  parallel: false
  commands:
    federation-pipeline:
      run: npm test
